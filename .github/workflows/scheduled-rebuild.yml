name: Scheduled Rebuild

on:
  schedule:
    - cron: "0 3 * * 1"  # Monday 3:00 UTC
  workflow_dispatch:
    inputs:
      cleanup_dry_run:
        description: "Run the package cleanup in dry-run mode (no deletions)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  rebuild:
    name: Rebuild all images
    # A dry-run dispatch skips the ~20-min rebuild so the cleanup can be
    # tested on its own; the scheduled run and real dispatches still rebuild.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.cleanup_dry_run) }}
    uses: ./.github/workflows/build.yml

  cleanup:
    name: Prune obsolete package versions
    needs: rebuild
    # Run after the rebuild regardless of its result -- a cosmetic sub-job
    # failure (badge push race, a transient flake) must not skip the purge.
    # The purge never deletes a referenced image, so running it after an
    # imperfect rebuild is safe. Only a cancelled rebuild skips it.
    if: ${{ always() && needs.rebuild.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Prune untagged and stale GHCR versions
        # In-repo script rather than dataaxiom/ghcr-cleanup-action: that
        # action fatally errors on the 404 a DELETE returns when its target
        # was already removed by a manifest cascade. The script treats a 404
        # as success (the version is already gone).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: getbrik
          # Keep this list in sync with the stacks declared in versions.json.
          PACKAGES: brik-runner-base,brik-runner-node,brik-runner-python,brik-runner-java,brik-runner-rust,brik-runner-dotnet,brik-runner-analysis,brik-runner-scanner,brik-runner-deploy
          KEEP_N_SHA: "20"
          DRY_RUN: ${{ inputs.cleanup_dry_run || false }}
        run: ./scripts/cleanup-ghcr.sh
